services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:-StockSnap local development contact@example.com}
      ALLOWED_ORIGINS: http://localhost:3000
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
